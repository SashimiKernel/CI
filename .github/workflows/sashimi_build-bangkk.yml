name: Sashimi CI Bangkk
run-name: Bangkk | ${{ inputs.branch }} | ${{ github.run_number }}.${{ github.run_attempt }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Kernel Branch
        required: true
        default: seventeen
        type: string
      clean_build:
        description: Clean Build (Skip Ccache & Toolchain Restore)
        required: true
        default: false
        type: boolean
      customize_kernel_string:
        description: Customize Kernel String
        required: true
        default: false
        type: boolean
      kernel_string:
        description: Custom Kernel String
        required: true
        default: '-Sashimi'
        type: string
      build_ksu:
        description: Build ReSukiSU
        required: true
        default: true
        type: boolean
      build_susfs:
        description: Build SusFS
        required: true
        default: true
        type: boolean
      upload_telegram:
        description: Upload Build to Telegram
        required: true
        default: true
        type: boolean
      create_release:
        description: Create GitHub Release
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: sashimi-ci-bangkk-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      CLANG_REV: r596125
      CLANG_VERSION: clang-22.0.2
      TC_DIR: /home/runner/tc/clang-22.0.2
      TC_CACHE_NAME: clang-r596125-v2
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: 'true'
      CCACHE_COMPRESS: 'true'
      CCACHE_SLOPPINESS: time_macros
      SKIP_UPLOAD: '1'

    steps:
      - name: Validate Inputs
        env:
          KERNEL_BRANCH: ${{ inputs.branch }}
          KERNEL_TOKEN: ${{ secrets.PAT }}
          CUSTOMIZE_STRING: ${{ inputs.customize_kernel_string }}
          KERNEL_STRING: ${{ inputs.kernel_string }}
          UPLOAD_TELEGRAM: ${{ inputs.upload_telegram }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
        run: |
          git check-ref-format --branch "$KERNEL_BRANCH" > /dev/null 2>&1 || {
            echo "::error::Invalid kernel branch."
            exit 1
          }
          [[ -n "$KERNEL_TOKEN" ]] || {
            echo "::error::PAT is required to access the private kernel repository."
            exit 1
          }
          if [[ "$CUSTOMIZE_STRING" == true ]]; then
            python3 - <<'PY'
          import os
          import unicodedata
          value = os.environ['KERNEL_STRING']
          if any(c in '\"\\' or unicodedata.category(c) == 'Cc' for c in value):
              raise SystemExit('::error::Kernel string cannot contain double quotes, backslashes or control characters.')
          PY
          fi
          if [[ "$UPLOAD_TELEGRAM" == true ]]; then
            [[ -n "$BOT_TOKEN" && -n "$CHAT_ID" ]] || {
              echo "::error::BOT_TOKEN and CHAT_ID are required for Telegram uploads."
              exit 1
            }
            if [[ -n "$MESSAGE_THREAD_ID" && ! "$MESSAGE_THREAD_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::MESSAGE_THREAD_ID must be a positive integer."
              exit 1
            fi
          fi

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Setup Dependencies & ID
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison build-essential ccache curl flex git jq libarchive-tools libelf-dev libssl-dev python3 unzip util-linux xz-utils zip zstd
          {
            echo "DATE_STR=$(date +'%d.%m.%y')"
            echo "DATE_TAG=$(date +'%Y%m%d')"
            echo "RELEASE_TAG=bangkk-$(date +'%d%m%y')-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Restore ccache
        if: ${{ !inputs.clean_build }}
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-v2-${{ env.CLANG_REV }}-${{ inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache-v2-${{ env.CLANG_REV }}-${{ inputs.branch }}-
            ${{ runner.os }}-${{ runner.arch }}-ccache-v2-${{ env.CLANG_REV }}-

      - name: Prepare ccache
        id: cacheprep
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache -z
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Restore Toolchain
        id: toolchain
        if: ${{ !inputs.clean_build }}
        continue-on-error: true
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ env.TC_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-toolchain-${{ env.TC_CACHE_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-toolchain-${{ env.TC_CACHE_NAME }}-

      - name: Clone Kernel Repo
        uses: actions/checkout@v7.0.1
        with:
          repository: SashimiKernel/android_kernel_motorola_sm6375
          ref: ${{ inputs.branch }}
          token: ${{ secrets.PAT }}
          path: android_kernel_motorola_sm6375
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Clone Build Repo
        uses: actions/checkout@v7.0.1
        with:
          repository: SashimiKernel/CI
          ref: main
          path: CI
          fetch-depth: 1
          persist-credentials: false

      - name: Clone Scripts Repo
        uses: actions/checkout@v7.0.1
        with:
          repository: SashimiKernel/scripts
          ref: bangkk
          path: scripts
          fetch-depth: 1
          persist-credentials: false

      - name: Clone AnyKernel3
        uses: actions/checkout@v7.0.1
        with:
          repository: SashimiKernel/AnyKernel3
          ref: bangkk
          path: AnyKernel3
          fetch-depth: 1
          persist-credentials: false

      - name: Add 10 GiB Swap
        run: |
          SWAP_FILE="$RUNNER_TEMP/sashimi.swap"
          sudo fallocate -l 10G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          free -h

      - name: Move Scripts
        run: |
          for SCRIPT in scripts/sashimi.sh scripts/bot.sh; do
            bash -n "$SCRIPT"
          done
          install -m 755 scripts/sashimi.sh scripts/bot.sh android_kernel_motorola_sm6375/

      - name: Check Restored Toolchain
        id: restoredtc
        run: |
          READY=true
          for TOOL in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-size llvm-strip; do
            if [[ ! -x "$TC_DIR/bin/$TOOL" ]]; then
              READY=false
              break
            fi
          done
          echo "ok=$READY" >> "$GITHUB_OUTPUT"

      - name: Configure Kernel Options
        working-directory: android_kernel_motorola_sm6375
        env:
          CUSTOMIZE_STRING: ${{ inputs.customize_kernel_string }}
          KERNEL_STRING: ${{ inputs.kernel_string }}
          BUILD_KSU: ${{ inputs.build_ksu }}
          BUILD_SUSFS: ${{ inputs.build_susfs }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          base = Path('arch/arm64/configs/vendor/bangkk_defconfig')
          target = Path('arch/arm64/configs/moto.config')
          original = target.read_text()
          symbols = set(re.findall(r'\bCONFIG_(KSU(?:_[A-Z0-9_]+)?)\b', base.read_text() + '\n' + original))
          updates = {}
          manual = {'KSU_MANUAL_HOOK', 'KSU_MANUAL_HOOK_AUTO_SETUID_HOOK', 'KSU_MANUAL_HOOK_AUTO_INITRC_HOOK'}

          if os.environ['CUSTOMIZE_STRING'] == 'true':
              updates['LOCALVERSION'] = json.dumps(os.environ['KERNEL_STRING'], ensure_ascii=False)
          if os.environ['BUILD_KSU'] != 'true':
              updates.update((s, 'n') for s in symbols)
              updates.update(KSU='n', KSU_SUSFS='n')
          else:
              updates['KSU'] = 'y'
              if os.environ['BUILD_SUSFS'] == 'true':
                  updates.update((s, 'n') for s in symbols | manual if s.startswith('KSU_MANUAL_HOOK'))
                  updates['KSU_SUSFS'] = 'y'
              else:
                  updates.update((s, 'n') for s in symbols | {'KSU_SUSFS'} if s.startswith('KSU_SUSFS'))
                  updates.update((s, 'y') for s in manual)

          lines = []
          for line in original.splitlines():
              match = re.match(r'^(?:# )?CONFIG_([A-Z0-9_]+)(?:=| is not set)', line)
              if not match or match.group(1) not in updates:
                  lines.append(line)
          lines.extend(f'# CONFIG_{key} is not set' if value == 'n' else f'CONFIG_{key}={value}'
                       for key, value in sorted(updates.items()))
          target.write_text('\n'.join(lines) + '\n')
          print('Kernel options applied to moto.config.')
          PY

      - name: Compile Kernel
        id: compile
        working-directory: android_kernel_motorola_sm6375
        env:
          UPLOAD_TELEGRAM: ${{ inputs.upload_telegram }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          AK3_DIR: ${{ github.workspace }}/AnyKernel3
        run: |
          if [[ "$UPLOAD_TELEGRAM" == true ]]; then
            ./bot.sh
          else
            ./sashimi.sh -v bangkk
          fi

      - name: Notify Telegram on Cancel
        if: ${{ cancelled() && inputs.upload_telegram }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -n "$BOT_TOKEN" && -n "$CHAT_ID" ]] || exit 0
          API="https://api.telegram.org/bot${BOT_TOKEN}"
          KEYBOARD=$(jq -cn --arg url "$RUN_URL" '{inline_keyboard: [[{text: "Compilation", url: $url}]]}')
          RESPONSE=""
          if [[ -s "$RUNNER_TEMP/tg_msg_id" ]]; then
            MESSAGE_ID=$(< "$RUNNER_TEMP/tg_msg_id")
            if [[ "$MESSAGE_ID" =~ ^[1-9][0-9]*$ ]]; then
              RESPONSE=$(curl -fsS --connect-timeout 5 --max-time 15 -X POST "$API/editMessageText" \
                --data-urlencode "chat_id=$CHAT_ID" --data-urlencode "message_id=$MESSAGE_ID" \
                --data-urlencode 'text=Compilation Cancelled' --data-urlencode "reply_markup=$KEYBOARD" 2>/dev/null || true)
            fi
          fi
          if ! printf '%s' "$RESPONSE" | jq -e '.ok == true' > /dev/null 2>&1; then
            THREAD_ARGS=()
            if [[ "$MESSAGE_THREAD_ID" =~ ^[1-9][0-9]*$ ]]; then
              THREAD_ARGS=(--data-urlencode "message_thread_id=$MESSAGE_THREAD_ID")
            fi
            curl -fsS --connect-timeout 5 --max-time 15 -X POST "$API/sendMessage" \
              --data-urlencode "chat_id=$CHAT_ID" "${THREAD_ARGS[@]}" \
              --data-urlencode 'text=Compilation Cancelled' --data-urlencode "reply_markup=$KEYBOARD" > /dev/null 2>&1 || true
          fi

      - name: Ccache Stats
        if: ${{ always() && !cancelled() && steps.cacheprep.outputs.ready == 'true' }}
        continue-on-error: true
        run: ccache -s

      - name: Save ccache
        if: ${{ always() && !cancelled() && steps.cacheprep.outputs.ready == 'true' && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-v2-${{ env.CLANG_REV }}-${{ inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify Toolchain
        id: tccheck
        if: ${{ always() && !cancelled() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
        run: |
          READY=true
          for TOOL in clang ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-size llvm-strip; do
            if [[ ! -x "$TC_DIR/bin/$TOOL" ]]; then
              READY=false
              break
            fi
          done
          echo "ok=$READY" >> "$GITHUB_OUTPUT"

      - name: Save Toolchain
        if: ${{ always() && !cancelled() && steps.tccheck.outputs.ok == 'true' && (inputs.clean_build || steps.restoredtc.outputs.ok != 'true' || steps.toolchain.outputs.cache-matched-key == '' || steps.toolchain.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ env.TC_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-toolchain-${{ env.TC_CACHE_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare Release Artifacts
        id: artifacts
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        env:
          BUILD_KSU: ${{ inputs.build_ksu }}
          BUILD_SUSFS: ${{ inputs.build_susfs }}
          CREATE_RELEASE: ${{ inputs.create_release }}
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import zipfile
          from pathlib import Path
          from urllib.parse import quote

          kernel = Path('android_kernel_motorola_sm6375')
          config = (kernel / 'out/.config').read_bytes()
          settings = set(config.decode().splitlines())
          ksu = 'CONFIG_KSU=y' in settings
          susfs = 'CONFIG_KSU_SUSFS=y' in settings
          expected_ksu = os.environ['BUILD_KSU'] == 'true'
          expected_susfs = expected_ksu and os.environ['BUILD_SUSFS'] == 'true'
          if ksu != expected_ksu or susfs != expected_susfs:
              raise SystemExit('::error::Final KernelSU/SusFS configuration does not match the selected inputs.')
          if ksu and not susfs and 'CONFIG_KSU_MANUAL_HOOK=y' not in settings:
              raise SystemExit('::error::KernelSU manual hooks are missing.')
          zips = [p for p in kernel.glob('Sashimi-*.zip') if p.is_file() and p.stat().st_size]
          if len(zips) != 1:
              raise SystemExit(f'::error::Expected one Sashimi ZIP, found {len(zips)}.')
          source = zips[0]
          with zipfile.ZipFile(source) as archive:
              if archive.read('config') != config or archive.getinfo('Image').file_size == 0:
                  raise SystemExit('::error::ZIP contents do not match the generated build.')
          out = Path('release_out')
          out.mkdir(exist_ok=True)
          shutil.copy2(source, out / source.name)
          apks = sorted(Path('CI/Manager').glob('*.apk')) if ksu else []
          apks = [p for p in apks if p.is_file() and p.stat().st_size]
          for apk in apks:
              shutil.copy2(apk, out / apk.name)
          if ksu and not apks:
              print('::warning::No Manager APK found; packaging the kernel ZIP only.')
          hashes = {}
          for path in sorted(out.iterdir()):
              if path.is_file() and path.name != 'SHA256SUMS':
                  with path.open('rb') as stream:
                      hashes[path.name] = hashlib.file_digest(stream, 'sha256').hexdigest()
          (out / 'SHA256SUMS').write_text(''.join(f'{digest}  {name}\n' for name, digest in hashes.items()))
          base_url = f"{os.environ['SERVER_URL']}/{os.environ['REPO']}/releases/download/{os.environ['RELEASE_TAG']}"
          managers = []
          for apk in apks:
              if os.environ['CREATE_RELEASE'] == 'true':
                  managers.append(f'- [{apk.name}]({base_url}/{quote(apk.name, safe="")})')
              else:
                  managers.append(f'- {apk.name}')
          manager_text = '\n'.join(managers) or ('No Manager APK was bundled.' if ksu else 'ReSukiSU was not built.')
          branch = os.environ['BRANCH'].replace('\\', '\\\\').replace('|', '\\|').replace('`', '\\`')
          notes = (
              '## Sashimi Kernel — `bangkk`\n\n'
              '| | |\n|---|---|\n'
              f"| **Device:** | `bangkk` |\n| **Date:** | {os.environ['DATE_STR']} |\n"
              f'| **Branch:** | {branch} |\n'
              f"| **ReSukiSU:** | {'Yes' if ksu else 'No'} |\n| **SusFS:** | {'Yes' if susfs else 'No'} |\n\n"
              f'### Managers\n\n{manager_text}\n\n'
              f'### Hash\n\nSHA256: `{hashes[source.name]}`\n\nAll file hashes are included in `SHA256SUMS`.\n'
          )
          Path('release_notes.md').write_text(notes)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(notes)
          PY

      - name: Upload Build Artifact
        id: build_artifact
        if: ${{ !cancelled() && steps.artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sashimi-bangkk-${{ env.DATE_TAG }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: release_out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Create GitHub Release
        if: ${{ !cancelled() && inputs.create_release && steps.artifacts.outcome == 'success' }}
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Sashimi Kernel — ${{ env.DATE_STR }} (Bangkk)
          body_path: release_notes.md
          files: release_out/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-log-${{ github.run_number }}-${{ github.run_attempt }}
          path: android_kernel_motorola_sm6375/sashimi.log
          if-no-files-found: ignore
          retention-days: 7
