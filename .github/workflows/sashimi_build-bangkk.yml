name: Sashimi CI Bangkk

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel Branch'
        required: true
        default: 'seventeen'
        type: string
      clean_build:
        description: 'Clean Build (Dont Restore Ccache & Toolchain)'
        required: true
        default: false
        type: boolean
      customize_kernel_string:
        description: 'Customize Kernel String'
        required: true
        default: false
        type: boolean
      kernel_string:
        description: 'Custom Kernel String'
        required: true
        default: '-Sashimi'
        type: string
      build_ksu:
        description: 'Build ReSukiSU'
        required: true
        default: true
        type: boolean
      build_susfs:
        description: 'Build SusFS'
        required: true
        default: true
        type: boolean
      upload_telegram:
        description: 'Upload build to Telegram'
        required: true
        default: true
        type: boolean
      create_release:
        description: 'Create GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: sashimi-ci-bangkk-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      TC_CACHE_NAME: clang-neutron-06092026
      CCACHE_DIR: /home/runner/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: "5G"
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_SLOPPINESS: "file_macro,time_macros,include_file_mtime,include_file_ctime,locale"

    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Setup Dependencies & ID
        run: |
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install libarchive-tools ccache zstd zip

          {
            echo "DATE_STR=$(date +'%d.%m.%y')"
            echo "DATE_TAG=$(date +'%Y%m%d')"
            echo "RELEASE_TAG=bangkk-$(date +'%d%m%y')-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_ENV"

      - name: Restore ccache
        if: ${{ !inputs.clean_build }}
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-${{ inputs.branch }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ inputs.branch }}-
            ${{ runner.os }}-ccache-

      - name: Prepare ccache
        env:
          CLEAN_BUILD: ${{ inputs.clean_build }}
        run: |
          if [ "$CLEAN_BUILD" = "true" ]; then
            rm -rf "$CCACHE_DIR"
            echo "Clean build requested: ccache dir reset."
          fi
          mkdir -p "$CCACHE_DIR"
          ccache --max-size="$CCACHE_MAXSIZE"
          ccache -z

      - name: Restore Toolchain
        id: toolchain
        if: ${{ !inputs.clean_build }}
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/tc
          key: ${{ runner.os }}-${{ env.TC_CACHE_NAME }}

      - name: Clean Toolchain Cache
        if: ${{ inputs.clean_build }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TC_KEY: ${{ runner.os }}-${{ env.TC_CACHE_NAME }}
        run: |
          rm -rf /home/runner/tc
          gh cache delete "$TC_KEY" --repo "$REPO" || echo "No toolchain cache to delete."
          echo "Clean build requested: toolchain cache reset."

      - name: Clone Kernel Repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.PAT }}
          repository: 'SashimiKernel/android_kernel_motorola_sm6375'
          ref: ${{ inputs.branch }}
          path: 'android_kernel_motorola_sm6375'
          fetch-depth: 0
          persist-credentials: false

      - name: Clone Build Repo
        uses: sushikernel/github-repo-action@v3.1
        with:
          depth: 1
          branch: 'main'
          owner: 'SashimiKernel'
          repository: 'CI'

      - name: Set SWAP to 10G
        uses: SushiKernel/swap@moe
        with:
          swap-size-gb: 10

      - name: Clone Scripts Repo
        uses: sushikernel/github-repo-action@v3.1
        with:
          depth: 1
          owner: 'SashimiKernel'
          branch: 'bangkk'
          repository: 'scripts'

      - name: Move Scripts
        working-directory: ./scripts
        run: |
          chmod +x *.sh
          cp sashimi.sh bot.sh ../android_kernel_motorola_sm6375

      - name: Configure Kernel Options
        working-directory: ./android_kernel_motorola_sm6375
        env:
          CUSTOMIZE_STRING: ${{ inputs.customize_kernel_string }}
          KERNEL_STRING: ${{ inputs.kernel_string }}
          BUILD_KSU: ${{ inputs.build_ksu }}
          BUILD_SUSFS: ${{ inputs.build_susfs }}
        run: |
          if [ "$CUSTOMIZE_STRING" = "true" ]; then
            if [[ "$KERNEL_STRING" == *[\"\\]* ]] || [[ "$KERNEL_STRING" =~ [[:cntrl:]] ]]; then
              echo "::error::Kernel string cannot contain double quotes, backslashes or control characters."
              exit 1
            fi
            ESCAPED_STRING=$(printf '%s' "$KERNEL_STRING" | sed 's/[|&]/\\&/g')
            DEFCONFIG_FILE=$(find arch/arm64/configs -name "bangkk_defconfig" | head -n 1)
            if [ -n "$DEFCONFIG_FILE" ]; then
              if grep -q "^CONFIG_LOCALVERSION=" "$DEFCONFIG_FILE"; then
                sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"${ESCAPED_STRING}\"|" "$DEFCONFIG_FILE"
              else
                echo "CONFIG_LOCALVERSION=\"${KERNEL_STRING}\"" >> "$DEFCONFIG_FILE"
              fi
              echo "Kernel string set to '${KERNEL_STRING}' in $DEFCONFIG_FILE"
            else
              echo "::warning::customize_kernel_string was true but bangkk_defconfig was not found; string not applied."
            fi
          fi

          if [ "$BUILD_KSU" = "false" ]; then
            MOTO_CONFIG="arch/arm64/configs/moto.config"
            if [ -f "$MOTO_CONFIG" ]; then
              sed -i -E 's/^CONFIG_KSU(_[A-Z0-9_]*)?=.*/# CONFIG_KSU\1 is not set/' "$MOTO_CONFIG"
              echo "ReSukiSU disabled in $MOTO_CONFIG"
            else
              echo "::warning::build_ksu was false but $MOTO_CONFIG was not found; KSU config unchanged."
            fi
          fi

          if [ "$BUILD_SUSFS" = "false" ]; then
            MOTO_CONFIG="arch/arm64/configs/moto.config"
            if [ -f "$MOTO_CONFIG" ]; then
              sed -i -E 's/^CONFIG_KSU_SUSFS(_[A-Z0-9_]*)?=.*/# CONFIG_KSU_SUSFS\1 is not set/' "$MOTO_CONFIG"
              echo "SusFS disabled in $MOTO_CONFIG"
            else
              echo "::warning::build_susfs was false but $MOTO_CONFIG was not found; SusFS config unchanged."
            fi
          fi

      - name: Compile Kernel
        working-directory: ./android_kernel_motorola_sm6375
        env:
          UPLOAD_TELEGRAM: ${{ inputs.upload_telegram }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_THREAD_ID: ${{ secrets.MESSAGE_THREAD_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SKIP_UPLOAD: "1"
        run: |
          if [ "$UPLOAD_TELEGRAM" = "true" ]; then
            ./bot.sh
          else
            ./sashimi.sh -v bangkk
          fi

      - name: Ccache Stats
        if: ${{ always() }}
        run: |
          ccache -s

      - name: Save ccache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ${{ runner.os }}-ccache-${{ inputs.branch }}-${{ github.run_id }}

      - name: Verify Toolchain
        id: tccheck
        if: ${{ always() && steps.toolchain.outputs.cache-hit != 'true' }}
        run: |
          if compgen -G "/home/runner/tc/*/bin/clang" > /dev/null; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Toolchain not found in /home/runner/tc; skipping toolchain cache save."
          fi

      - name: Save Toolchain
        if: ${{ always() && steps.tccheck.outputs.ok == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: /home/runner/tc
          key: ${{ runner.os }}-${{ env.TC_CACHE_NAME }}

      - name: Prepare Release Artifacts
        if: ${{ success() }}
        env:
          BUILD_KSU: ${{ inputs.build_ksu }}
          BRANCH: ${{ inputs.branch }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p release_out
          ZIP_FILE=$(find android_kernel_motorola_sm6375 -maxdepth 2 -type f -iname "Sashimi-*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No Sashimi ZIP found"
            exit 1
          fi

          cp "$ZIP_FILE" release_out/
          ZIP_NAME=$(basename "$ZIP_FILE")
          SHA256=$(sha256sum "release_out/$ZIP_NAME" | awk '{print $1}')

          shopt -s nullglob
          apks=()
          if [ "$BUILD_KSU" = "true" ]; then
            if [ -d "CI/Manager" ]; then
              apks=(CI/Manager/*.apk)
            elif [ -d "Manager" ]; then
              apks=(Manager/*.apk)
            fi
            if [ "${#apks[@]}" -gt 0 ]; then
              cp "${apks[@]}" release_out/
            else
              echo "::warning::No Manager APK found, releasing zip only."
            fi
          fi
          shopt -u nullglob

          BASE_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}"
          if [ "$BUILD_KSU" = "true" ]; then
            KSU_LABEL="Yes"
            MANAGERS=""
            for apk in "${apks[@]}"; do
              name=$(basename "$apk")
              MANAGERS+="- [${name%.apk}](${BASE_URL}/${name})"$'\n'
            done
            [ -n "$MANAGERS" ] || MANAGERS="No Manager APK was bundled with this release."
          else
            KSU_LABEL="No"
            MANAGERS="ReSukiSU was not built for this release."
          fi

          cat > release_notes.md <<EOF
          ## Sashimi Kernel — \`bangkk\`

          | | |
          |---|---|
          | **Device:** | \`bangkk\` |
          | **Date:** | ${DATE_STR} |
          | **Branch:** | \`${BRANCH}\` |
          | **ReSukiSU:** | ${KSU_LABEL} |

          ### Managers

          ${MANAGERS}

          ### Hash

          SHA256: \`${SHA256}\`
          EOF

      - name: Create GitHub Release
        if: ${{ success() && inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sashimi Kernel — ${{ env.DATE_STR }} (Bangkk)
          body_path: release_notes.md
          files: release_out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifact
        if: ${{ success() && !inputs.create_release }}
        uses: actions/upload-artifact@v4
        with:
          name: sashimi-bangkk-${{ env.DATE_TAG }}-${{ github.run_number }}
          path: release_out/
          retention-days: 7

      - name: Upload Build Log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: android_kernel_motorola_sm6375/sashimi.log
          if-no-files-found: ignore
          retention-days: 7
